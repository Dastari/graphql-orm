name: Workspace release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable workspace release ID (workspace-YYYY.MM.DD.N)
        required: true
        type: string
      target_ref:
        description: Full commit SHA expected to equal current main
        required: true
        type: string
      validation_profile:
        description: Full matrix by default; scoped profile is source-only with explicit approval
        required: true
        default: full
        type: choice
        options:
          - full
          - replay-scoped-positive-v1
      release_approval_reference:
        description: Required scoped publication approval binding target_ref, profile and retained gaps
        required: false
        type: string
      include_router_artifact:
        description: Build and attach the reviewed Linux router artifact
        required: true
        default: false
        type: boolean
      router_distribution_approval:
        description: Required approval/evidence reference when attaching the router binary
        required: false
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: workspace-release
  cancel-in-progress: false

# Release validation is decomposed into independent jobs that mirror the CI
# workflow, and the AI provider lanes fan out one runner per provider feature,
# so no single `target/` ever holds every package, backend, and provider
# permutation. Debug info and incremental artifacts still dominate whatever a
# lane leaves behind and contribute nothing to a test, Clippy, rustdoc, or
# check lane, so they stay disabled rather than dropping or weakening any lane.
# Failure backtraces lose line detail; the CI workflow keeps `line-tables-only`
# for diagnosis.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  guard:
    name: Prove the selected source is current main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The protected `release` environment stays on the single entry job. Every
    # validation lane and the publication job depend on it, so one human
    # approval still gates the whole run before any release lane compiles
    # anything, exactly as the single `validate` job required.
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
      - name: Prove the selected source is current main
        env:
          VALIDATION_PROFILE: ${{ inputs.validation_profile }}
          RELEASE_APPROVAL: ${{ inputs.release_approval_reference }}
          TARGET_REF: ${{ inputs.target_ref }}
          RELEASE_ID: ${{ inputs.release_id }}
          INCLUDE_ROUTER: ${{ inputs.include_router_artifact }}
          ROUTER_APPROVAL: ${{ inputs.router_distribution_approval }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # An environment name alone does not enforce human approval.
          protection=$(gh api "repos/$GITHUB_REPOSITORY/environments/release" \
            --jq '.protection_rules | any(.type == "required_reviewers" and any(.reviewers[]; .type == "User" and .reviewer.login == "Dastari"))')
          test "$protection" = true
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "${TARGET_REF}"
          git fetch origin main --tags --force
          test "$(git rev-parse HEAD)" = "${TARGET_REF}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if git show-ref --verify --quiet "refs/tags/${RELEASE_ID}"; then
            echo "release tag already exists: ${RELEASE_ID}" >&2
            exit 1
          fi
          if [[ "${INCLUDE_ROUTER}" == "true" && -z "${ROUTER_APPROVAL}" ]]; then
            echo "router_distribution_approval is required for a router binary" >&2
            exit 1
          fi
          case "${VALIDATION_PROFILE}" in
            full) ;;
            replay-scoped-positive-v1)
              test "${INCLUDE_ROUTER}" = false
              test -n "${RELEASE_APPROVAL}"
              python3 scripts/replay_release.py reuse --ref "${TARGET_REF}" \
                --output "${RUNNER_TEMP}/scoped-admission.json"
              ;;
            *) echo "unsupported release validation profile" >&2; exit 1 ;;
          esac

  workspace-integrity:
    if: inputs.validation_profile == 'full'
    name: Workspace integrity and release metadata
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Validate documentation and release metadata
        run: |
          python3 scripts/check-documentation.py
          python3 scripts/generate-workspace-inventory.py --check
          python3 scripts/check-release-state.py
          scripts/check-release-manifest.sh
          python3 scripts/test-router-notices.py
          scripts/check-workspace-dependencies.sh
          cargo fmt --all -- --check

  neutral-packages:
    if: inputs.validation_profile == 'full'
    name: Neutral package lanes
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify neutral packages
        run: |
          cargo test -p graphql-orm-operation-catalog -p graphql-orm-ai-tool-profiles --locked
          cargo test -p graphql-orm-storage --locked
          cargo test -p graphql-orm-backup --features orm-sqlite --locked
          cargo clippy -p graphql-orm-operation-catalog -p graphql-orm-ai-tool-profiles -p graphql-orm-storage --all-targets --locked -- -D warnings
          cargo clippy -p graphql-orm-backup --all-targets --features orm-sqlite --locked -- -D warnings
          RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc -p graphql-orm-operation-catalog -p graphql-orm-ai-tool-profiles -p graphql-orm-storage --no-deps --locked
          RUSTDOCFLAGS="-D warnings" cargo doc -p graphql-orm-backup --features orm-sqlite --no-deps --locked

  s3-security:
    if: inputs.validation_profile == 'full'
    name: Owned S3 transport and single-attempt deletion
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Require owned lost-response and trusted/untrusted HTTPS regressions
        run: bash scripts/run-owned-s3-security-tests.sh
      - name: Lint the supported storage target profile
        run: cargo clippy -p graphql-orm-storage --locked --no-default-features --features local,s3,azure --all-targets -- -D warnings
      - name: Document local and S3 storage with warnings denied
        run: RUSTDOCFLAGS="-D warnings" cargo doc -p graphql-orm-storage --locked --no-default-features --features local,s3 --no-deps
      - name: Compile the backup adapter with the storage S3 provider
        run: cargo check -p graphql-orm-backup --locked --features graphql-orm-storage/s3

  orm:
    if: inputs.validation_profile == 'full'
    name: ORM backend lanes
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Execute opt-in runtime GraphQL reads and mutations on owned backends
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo test -p graphql-orm --locked --no-default-features --features sqlite,runtime-graphql --lib --test runtime_graphql --test runtime_mutations --test runtime_queries --test runtime_relations -- --test-threads=1
          cargo test -p graphql-orm --locked --no-default-features --features postgres,runtime-graphql --lib --test runtime_graphql --test runtime_mutations -- --test-threads=1
          cargo test -p graphql-orm --locked --no-default-features --features mssql,runtime-graphql --test runtime_graphql_unsupported
      - name: Verify ORM backend lanes
        run: |
          cargo test -p graphql-orm --locked
          cargo test -p graphql-orm --no-default-features --features sqlite,router-protocol --test federation_entity_keys_contract --locked
          cargo test -p graphql-orm --no-default-features --features sqlite,field-case-pascal,argument-case-snake --test federation_entity_keys_case_features --locked
          cargo check -p graphql-orm --no-default-features --features postgres --locked
          cargo test -p graphql-orm --no-default-features --features postgres --test federation_entity_keys_postgres --locked
          cargo test -p graphql-orm --locked --no-default-features --features postgres --test runtime_mutations --test runtime_migrations --test runtime_schema_ir --test runtime_migration_memory --test migration_planner --test migration_apply --test legacy_migration_history -- --test-threads=1
          cargo test -p graphql-orm --locked --no-default-features --features mssql --test runtime_migrations_unsupported
          for backend in sqlite postgres mssql; do
            cargo test --manifest-path crates/graphql-orm/tests/fixtures/migration-api-compatibility/Cargo.toml --locked --no-default-features --features "$backend"
          done
          cargo test -p graphql-orm --no-default-features --features postgres --test projection_visibility --test cross_crate_relations_fixture --test repository_counts --locked
          cargo test -p graphql-orm --no-default-features --features postgres --test grouped_aggregates_postgres --test portable_group_pages --test host_timestamps --locked -- --ignored --test-threads=1
          cargo test -p graphql-orm --locked --no-default-features --features postgres --test runtime_strings -- --include-ignored --test-threads=1
          cargo test --manifest-path crates/graphql-orm/tests/fixtures/repository-aggregate-consumer/Cargo.toml --locked --no-default-features --features postgres --test runtime_strings -- --ignored --test-threads=1
          cargo run --manifest-path crates/graphql-orm/tests/fixtures/repository-aggregate-consumer/Cargo.toml --locked --no-default-features --features sqlite --example runtime_strings
          cargo run --manifest-path crates/graphql-orm/tests/fixtures/repository-aggregate-consumer/Cargo.toml --locked --no-default-features --features sqlite --example policy_projections
          cargo run --manifest-path crates/graphql-orm/tests/fixtures/repository-aggregate-consumer/Cargo.toml --locked --no-default-features --features sqlite --example complete_events
          cargo test --manifest-path crates/graphql-orm/tests/fixtures/repository-aggregate-consumer/Cargo.toml --locked --no-default-features --features postgres --test portable_groups --test host_timestamps -- --ignored --test-threads=1
          cargo check -p graphql-orm --no-default-features --features mssql --locked
          cargo test -p graphql-orm --no-default-features --features mssql --test federation_entity_keys_mssql --test runtime_records --test query_ir --locked
          cargo clippy -p graphql-orm --all-targets --locked -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc -p graphql-orm -p graphql-orm-macros --no-deps --locked

  orm-security-sqlite:
    if: inputs.validation_profile == 'full'
    name: Current authority and subscription privacy (SQLite)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Require current authority, strict policies, pagination, and private event delivery
        run: |
          bash scripts/run-security-test-targets.sh sqlite,auth-agql \
            current_authority authorization_mode authorized_pagination \
            subscription_release_authorization subscription_provenance_authorization \
            subscription_repository_provenance

  orm-security-portable:
    if: inputs.validation_profile == 'full'
    name: Portable authorization and scan bounds (${{ matrix.backend }})
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        backend: [sqlite, postgres, mssql]
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Execute portable security regressions on an owned backend
        run: bash scripts/run-security-test-targets.sh "${{ matrix.backend }}" subscription_portable_authorization bounded_protected_scans
      - name: Compile and lint current-authority policy on the selected backend
        run: cargo clippy -p graphql-orm --locked --no-default-features --features "${{ matrix.backend }},auth-agql" --lib -- -D warnings

  sqlserver-security:
    if: inputs.validation_profile == 'full'
    name: Owned SQL Server transport and transaction checks
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify TLS, writes, and retained query notifications on owned servers
        run: cargo test -p graphql-orm --locked --no-default-features --features mssql --test mssql_tls --test mssql_writes --test mssql_notifications -- --ignored --test-threads=1

  ai-provider-matrix:
    if: inputs.validation_profile == 'full'
    name: Enumerate AI provider lanes
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      providers: ${{ steps.providers.outputs.providers }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
      - id: providers
        name: Read the provider lane list from the lane runner
        # The provider list stays owned by scripts/check-ai-provider-lanes.sh.
        # Reading it here means a provider added to the script cannot be
        # silently dropped from the release matrix.
        run: |
          set -euo pipefail
          providers=$(scripts/check-ai-provider-lanes.sh --list)
          echo "${providers}"
          printf 'providers=%s\n' "${providers}" >> "${GITHUB_OUTPUT}"

  ai-provider-lanes:
    if: inputs.validation_profile == 'full'
    name: AI provider lane (${{ matrix.provider }})
    needs:
      - guard
      - ai-provider-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Release runs are rare and gate an immutable publication, so report
      # every failing provider lane instead of cancelling the siblings.
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.ai-provider-matrix.outputs.providers) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
      - name: Reclaim runner disk
        # graphql-orm-ai relinks every test binary for the test, Clippy, and
        # rustdoc lane of this provider. One provider per runner is what fixes
        # the exhaustion; reclaiming the unused preinstalled toolchains keeps
        # headroom for the crate that originally filled the disk.
        uses: ./.github/actions/reclaim-runner-disk
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.provider }}
      - name: Verify the provider lane
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          scripts/check-ai-provider-lanes.sh test "${PROVIDER}"
          scripts/check-ai-provider-lanes.sh clippy "${PROVIDER}"
          scripts/check-ai-provider-lanes.sh doc "${PROVIDER}"

  ai-graphql-naming:
    if: inputs.validation_profile == 'full'
    name: AI GraphQL naming lane
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test -p graphql-orm-ai --features graphql-case-pascal --test graphql_naming --locked

  ai-postgres-parity:
    if: inputs.validation_profile == 'full'
    name: AI PostgreSQL parity lane
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run ORM parity against a test-owned disposable PostgreSQL container
        run: cargo test -p graphql-orm-ai --no-default-features --features postgres,provider-openai --test postgres_parity --locked -- --test-threads=1

  alternate-features:
    if: inputs.validation_profile == 'full'
    name: Alternate feature lanes
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify alternate AI, storage, and backup lanes
        run: |
          cargo check -p graphql-orm-ai --no-default-features --features postgres --locked
          cargo check -p graphql-orm-ai --no-default-features --features mssql --locked
          cargo check -p graphql-orm-ai -p graphql-orm --no-default-features --features graphql-orm-ai/sqlite,graphql-orm/mssql --locked
          cargo check -p graphql-orm-backup --no-default-features --features local,orm-postgres --locked
          cargo check -p graphql-orm-storage --no-default-features --features s3,azure --locked
          cargo check -p graphql-orm-storage --no-default-features --features smb --locked

  router:
    if: inputs.validation_profile == 'full'
    name: Router lanes
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify router lanes
        run: |
          cargo test -p graphql-orm-router-protocol --locked
          cargo test -p graphql-orm-router --locked
          cargo test -p graphql-orm-router --features auth-agql --locked
          cargo clippy -p graphql-orm-router-protocol --all-targets --locked -- -D warnings
          cargo clippy -p graphql-orm-router --all-targets --features auth-agql --locked -- -D warnings
          RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc -p graphql-orm-router-protocol --no-deps --locked
          RUSTDOCFLAGS="-D warnings" cargo doc -p graphql-orm-router --no-deps --features auth-agql --locked

  router-msrv:
    if: inputs.validation_profile == 'full'
    name: Router minimum supported Rust version
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify router minimum supported Rust version
        run: |
          cargo test -p graphql-orm-router-protocol --locked
          cargo test -p graphql-orm-router --locked

  validate:
    if: inputs.validation_profile == 'full'
    name: Release validation complete
    needs:
      - guard
      - workspace-integrity
      - neutral-packages
      - s3-security
      - orm
      - orm-security-sqlite
      - orm-security-portable
      - sqlserver-security
      - ai-provider-matrix
      - ai-provider-lanes
      - ai-graphql-naming
      - ai-postgres-parity
      - alternate-features
      - router
      - router-msrv
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every release validation lane to have succeeded
        # A failed or cancelled dependency already skips this job. The explicit
        # assertion also fails the release when a lane is skipped, so a future
        # condition on a validation job cannot quietly narrow what an immutable
        # release was verified against.
        env:
          LANE_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          unsuccessful=$(
            jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' \
              <<<"${LANE_RESULTS}"
          )
          if [[ -n "${unsuccessful}" ]]; then
            echo "release: validation lanes did not succeed:" >&2
            echo "${unsuccessful}" >&2
            exit 1
          fi
          jq -r 'to_entries[] | "release: \(.key) succeeded"' <<<"${LANE_RESULTS}"

  replay-scoped-integrity:
    name: Scoped source identity, evidence reuse and release metadata
    if: inputs.validation_profile == 'replay-scoped-positive-v1'
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # pinned installer
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Run only literal positive metadata commands
        run: python3 scripts/run-replay-release-positive.py metadata --output target/release-evidence/replay-scoped-integrity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: replay-scoped-integrity
          path: target/release-evidence/replay-scoped-integrity/
          if-no-files-found: error
          retention-days: 30

  replay-scoped-positive:
    name: Scoped native replay and compatibility (${{ matrix.toolchain }})
    if: inputs.validation_profile == 'replay-scoped-positive-v1'
    needs: [guard, replay-scoped-integrity]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.97.1', '1.98.1']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
      - uses: ./.github/actions/reclaim-runner-disk
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # pinned installer
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: replay-scoped-${{ matrix.toolchain }}
      - name: Run only literal positive ORM commands
        env:
          REPLAY_TOOLCHAIN: ${{ matrix.toolchain }}
        run: python3 scripts/run-replay-release-positive.py "${REPLAY_TOOLCHAIN}" --output "target/release-evidence/replay-scoped-${REPLAY_TOOLCHAIN}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: replay-scoped-${{ matrix.toolchain }}
          path: target/release-evidence/replay-scoped-${{ matrix.toolchain }}/
          if-no-files-found: error
          retention-days: 30

  replay-scoped-validate:
    name: Require every mandatory scoped gate and both compiler records
    if: inputs.validation_profile == 'replay-scoped-positive-v1'
    needs: [guard, replay-scoped-integrity, replay-scoped-positive]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
      - name: Require all selected scoped jobs to have succeeded
        env:
          LANE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          lanes = json.loads(os.environ['LANE_RESULTS'])
          expected = {'guard', 'replay-scoped-integrity', 'replay-scoped-positive'}
          if set(lanes) != expected or any(lane['result'] != 'success' for lane in lanes.values()):
              raise SystemExit('mandatory scoped release gate did not succeed')
          print('Every mandatory scoped gate succeeded; excluded full-profile gates remain unexecuted.')
          PYTHON
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: replay-scoped-*
          path: target/scoped-results
      - name: Verify complete source-bound records, counts and checksums
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_APPROVAL: ${{ inputs.release_approval_reference }}
        run: |
          python3 scripts/replay_release.py bundle --results target/scoped-results \
            --release-id "${RELEASE_ID}" --approval-reference "${RELEASE_APPROVAL}" \
            --output "target/validated/${RELEASE_ID}-verification.json"

  release:
    if: inputs.validation_profile == 'full'
    permissions:
      contents: write
      id-token: write
      attestations: write
    name: Publish immutable workspace release
    needs:
      - guard
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
      - name: Restore release tag visibility
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          # The release identity proof - current main, unused workspace tag,
          # router approval - runs once in the guard job before any validation
          # lane, exactly as it did before validation was split. This job only
          # re-establishes the tag data that the manifest generator and the tag
          # step read, and confirms this runner checked out the validated
          # commit.
          git fetch origin main --tags --force
          test "$(git rev-parse HEAD)" = "${TARGET_REF}"
      - name: Reclaim runner disk
        # Only the optional router artifact compiles anything in this job.
        if: inputs.include_router_artifact
        uses: ./.github/actions/reclaim-runner-disk
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Generate deterministic release bundle
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          mkdir -p release-dist
          python3 scripts/generate-release-manifest.py \
            --release-id "${RELEASE_ID}" \
            --ref HEAD \
            --check-clean \
            --verify-tags \
            --output "release-dist/${RELEASE_ID}.json" \
            --notes-output "release-dist/${RELEASE_ID}.md"
      - name: Build approved router artifact
        if: inputs.include_router_artifact
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ROUTER_APPROVAL: ${{ inputs.router_distribution_approval }}
        run: |
          set -euo pipefail
          test "$(rustc -vV | sed -n 's/^host: //p')" = "x86_64-unknown-linux-gnu"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo build -p graphql-orm-router --release --features auth-agql --locked
          cargo cyclonedx \
            --manifest-path crates/graphql-orm-router/Cargo.toml \
            --format json \
            --spec-version 1.5 \
            --features auth-agql \
            --target x86_64-unknown-linux-gnu
          install -m 0755 target/release/graphql-orm-router release-dist/graphql-orm-router
          cp crates/graphql-orm-router/graphql-orm-router.cdx.json \
            release-dist/graphql-orm-router.cdx.json
          cargo metadata --format-version 1 --locked \
            --filter-platform x86_64-unknown-linux-gnu \
            --features graphql-orm-router/auth-agql > release-dist/router-metadata.json
          python3 scripts/generate-router-notices.py \
            --metadata release-dist/router-metadata.json \
            --sbom release-dist/graphql-orm-router.cdx.json \
            --output release-dist/router-notices \
            --rust-sysroot "$(rustc --print sysroot)"
          rm release-dist/router-metadata.json
          cp LICENSE release-dist/LICENSE
          printf '%s\n' "${ROUTER_APPROVAL}" > release-dist/router-distribution-approval.txt
          tar -C release-dist --sort=name --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            -czf "release-dist/${RELEASE_ID}-graphql-orm-router-x86_64-unknown-linux-gnu.tar.gz" \
            graphql-orm-router graphql-orm-router.cdx.json LICENSE \
            router-distribution-approval.txt router-notices
          rm -r -- release-dist/router-notices
          rm release-dist/graphql-orm-router release-dist/graphql-orm-router.cdx.json \
            release-dist/LICENSE release-dist/router-distribution-approval.txt
      - name: Create checksums
        run: |
          cd release-dist
          sha256sum -- * > SHA256SUMS
      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.release_id }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 30
      - name: Create annotated release tags
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tags_to_push=()
          while IFS= read -r package_tag; do
            if git show-ref --verify --quiet "refs/tags/${package_tag}"; then
              continue
            fi
            git tag -a "${package_tag}" -m "${package_tag}"
            tags_to_push+=("refs/tags/${package_tag}")
          done < <(jq -r '.packages[].tag' "release-dist/${RELEASE_ID}.json")
          git tag -a "${RELEASE_ID}" -m "${RELEASE_ID}"
          tags_to_push+=("refs/tags/${RELEASE_ID}")
          git push --atomic origin "${tags_to_push[@]}"
      - name: Publish immutable workspace release
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "${RELEASE_ID}" \
            --verify-tag \
            --title "${RELEASE_ID}" \
            --notes-file "release-dist/${RELEASE_ID}.md" \
            "${prerelease_flag[@]}" \
            release-dist/*

  release-scoped:
    if: inputs.validation_profile == 'replay-scoped-positive-v1'
    permissions:
      contents: write
      id-token: write
      attestations: write
    name: Publish immutable scoped source release
    needs:
      - guard
      - replay-scoped-validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
      - name: Restore release tag visibility
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          # The release identity proof - current main, unused workspace tag,
          # router approval - runs once in the guard job before any validation
          # lane, exactly as it did before validation was split. This job only
          # re-establishes the tag data that the manifest generator and the tag
          # step read, and confirms this runner checked out the validated
          # commit.
          git fetch origin main --tags --force
          test "$(git rev-parse HEAD)" = "${TARGET_REF}"
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: replay-scoped-*
          path: target/scoped-results
      - name: Retain verified scoped evidence and original qualification archives
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_APPROVAL: ${{ inputs.release_approval_reference }}
        run: |
          python3 scripts/replay_release.py bundle --results target/scoped-results \
            --release-id "${RELEASE_ID}" --approval-reference "${RELEASE_APPROVAL}" \
            --output "target/scoped-dist/${RELEASE_ID}-verification.json"
      - name: Generate deterministic release bundle
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          mkdir -p target/scoped-dist
          python3 scripts/generate-release-manifest.py \
            --release-id "${RELEASE_ID}" \
            --ref HEAD \
            --check-clean \
            --verification-evidence "target/scoped-dist/${RELEASE_ID}-verification.json" \
            --verify-tags \
            --output "target/scoped-dist/${RELEASE_ID}.json" \
            --notes-output "target/scoped-dist/${RELEASE_ID}.md"
      - name: Create checksums
        run: |
          cd target/scoped-dist
          sha256sum -- * > SHA256SUMS
      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: target/scoped-dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.release_id }}
          path: target/scoped-dist/
          if-no-files-found: error
          retention-days: 30
      - name: Create annotated release tags
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          tags_to_push=()
          while IFS= read -r package_tag; do
            if git show-ref --verify --quiet "refs/tags/${package_tag}"; then
              continue
            fi
            git tag -a "${package_tag}" -m "${package_tag}"
            tags_to_push+=("refs/tags/${package_tag}")
          done < <(jq -r '.packages[].tag' "target/scoped-dist/${RELEASE_ID}.json")
          git tag -a "${RELEASE_ID}" -m "${RELEASE_ID}"
          tags_to_push+=("refs/tags/${RELEASE_ID}")
          git push --atomic origin "${tags_to_push[@]}"
      - name: Publish immutable workspace release
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "${RELEASE_ID}" \
            --verify-tag \
            --title "${RELEASE_ID}" \
            --notes-file "target/scoped-dist/${RELEASE_ID}.md" \
            "${prerelease_flag[@]}" \
            target/scoped-dist/*
