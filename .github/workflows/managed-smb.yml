name: Managed SMB

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/graphql-orm-backup/**"
      - "crates/graphql-orm-storage/**"
      - ".github/workflows/managed-smb.yml"
  workflow_dispatch:

# Superseded PR heads share a group; main and manual runs are never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  samba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: python3 crates/graphql-orm-storage/tests/samba/test_run.py
      - run: crates/graphql-orm-storage/tests/samba/run.sh
        env:
          SMB_TEST_PULL_POLICY: missing
