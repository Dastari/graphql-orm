name: Manual owned PostgreSQL qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owned-postgres-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/owned-postgres-complete
