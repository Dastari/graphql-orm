name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Superseded PR heads share a group; main runs are never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The companions job relinks every graphql-orm-ai test binary once per provider
# feature combination. With full debug info that exhausted the runner disk and
# the linker died with SIGBUS mid-link. `line-tables-only` keeps file and line
# numbers in failure backtraces, which is what CI diagnosis actually needs,
# at a fraction of the size.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  # Disposable runners may pull the digest-pinned owned SQL Server image;
  # local and qualification runs default to never pulling.
  GRAPHQL_ORM_TEST_MSSQL_PULL: missing

permissions:
  contents: read

jobs:
  owned-postgres-complete:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/owned-postgres-complete

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
      - name: Install the reviewed advisory scanner
        run: python3 scripts/install-reviewed-cargo-tool.py cargo-audit
      - run: python3 scripts/test-dependency-audit.py
      - name: Audit all tracked root and fixture lockfiles
        run: python3 scripts/check-dependency-audit.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit
          path: target/dependency-audit/
          if-no-files-found: error

  workspace-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check documentation governance
        run: python3 scripts/check-documentation.py --base "${BASE_SHA}"
      - name: Check generated workspace inventory
        run: python3 scripts/generate-workspace-inventory.py --check
      - name: Check Git-only release metadata
        run: |
          python3 scripts/check-release-state.py
          scripts/check-release-manifest.sh
          python3 scripts/check-ci-orm-split.py
          python3 scripts/test-router-notices.py
          python3 scripts/check-workflow-supply-chain.py
          python3 scripts/test-workflow-supply-chain.py
          python3 scripts/test-release-workflow-contract.py
          python3 scripts/test-reviewed-cargo-tool.py
      - name: Check PR documentation impact
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check-pr-documentation-impact.py
      - run: cargo fmt --all -- --check
      - name: Check standalone relationship fixture formatting
        run: cargo fmt --manifest-path crates/graphql-orm-macros/fixtures/relationship-capability/Cargo.toml --all -- --check
      - name: Check skill verification formatting
        run: cargo fmt --manifest-path skills/verify/Cargo.toml --all -- --check
      - name: Check the skill installer
        run: scripts/test-skill-install.sh
      - run: scripts/check-workspace-dependencies.sh
      - name: Check standalone minimal GraphQL features and host opt-ins
        run: |
          python3 scripts/check-graphql-features.py
          scripts/check-graphql-consumer.sh
      - run: cargo test -p graphql-orm-storage
      - run: cargo test -p graphql-orm-backup --features orm-sqlite
      - run: cargo test -p graphql-orm-operation-catalog -p graphql-orm-ai-tool-profiles

  s3-security:
    name: Owned S3 transport and single-attempt deletion
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Require owned lost-response and trusted/untrusted HTTPS regressions
        run: bash scripts/run-owned-s3-security-tests.sh
      - name: Lint the supported storage target profile
        run: cargo clippy -p graphql-orm-storage --locked --no-default-features --features local,s3,azure --all-targets -- -D warnings
      - name: Document local and S3 storage with warnings denied
        run: RUSTDOCFLAGS="-D warnings" cargo doc -p graphql-orm-storage --locked --no-default-features --features local,s3 --no-deps
      - name: Compile the backup adapter with the storage S3 provider
        run: cargo check -p graphql-orm-backup --locked --features graphql-orm-storage/s3

  # The ORM lanes run as four parallel jobs: the default suite with Clippy and
  # Rustdoc, the fixture workspaces it drives, runtime GraphQL on owned
  # backends, and the PostgreSQL and SQL Server lanes.
  orm:
    name: ORM default suite, Clippy and Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The fixture runner tests run in orm-fixtures; scripts/check-ci-orm-split.py
      # requires this list to be exactly the tests those binaries define.
      - run: cargo test -p graphql-orm -- --exact --skip sqlite_and_mssql_services_can_share_one_graphql_orm_build --skip direct_host_dependency_resolves_one_exact_agql_auth_universe --skip generated_relationships_execute_across_real_crate_boundaries --skip two_orm_subgraphs_compose_and_join_through_the_router --skip external_legacy_migration_surface_compiles --skip pascal_relationship_semantics_compile_as_a_complete_query_capability --skip external_repository_aggregate_consumer_requires_no_direct_graphql_dependency
      - run: cargo test -p graphql-orm --no-default-features --features sqlite,router-protocol --test federation_entity_keys_contract --test operation_catalog_sdl_conformance
      - run: cargo test -p graphql-orm --no-default-features --features sqlite,field-case-pascal,argument-case-snake --test federation_entity_keys_case_features
      - name: Check Changed catalogue and provenance with PascalCase arguments
        run: cargo test -p graphql-orm --features router-protocol,resolver-case-pascal,argument-case-pascal,field-case-pascal --test keyed_changed_subscriptions --test subscription_path_order --test empty_filter_semantics --test composite_subscription_scopes --test node_id_version_relations --test link_relation_patterns --test operation_catalog_sdl_conformance
      - run: cargo clippy -p graphql-orm --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p graphql-orm -p graphql-orm-macros --no-deps

  schema-export:
    name: Dedicated schema export
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: scripts/check-schema-export.sh

  orm-fixtures:
    name: ORM fixture workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test -p graphql-orm --test backend_coexistence_fixture --test cross_crate_relations_fixture --test federation_end_to_end_fixture --test migration_api_compatibility_fixture --test relationship_capability_fixture --test repository_aggregate_consumer_fixture
      - name: Run the graphql-orm-usage skill examples and behaviour contract
        run: cargo test --manifest-path skills/verify/Cargo.toml --target-dir target/fixtures --locked

  orm-runtime-graphql:
    name: ORM runtime GraphQL on owned backends
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Execute opt-in runtime GraphQL reads and mutations on owned backends
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo test -p graphql-orm --locked --no-default-features --features sqlite,runtime-graphql --lib --test runtime_graphql --test runtime_mutations --test runtime_scalar_readback --test runtime_queries --test runtime_relations --test runtime_live --test runtime_search_graphql --test runtime_search_writes --test runtime_operation_assurance -- --test-threads=1
          cargo test -p graphql-orm --locked --no-default-features --features postgres,runtime-graphql --lib --test runtime_graphql --test runtime_mutations --test runtime_scalar_readback --test runtime_live --test runtime_search_graphql --test runtime_search_writes --test runtime_search_ir -- --test-threads=1
          cargo test -p graphql-orm --locked --no-default-features --features mssql,runtime-graphql --test runtime_graphql_unsupported
          cargo check -p graphql-orm --locked --no-default-features --features sqlite,mssql,runtime-graphql --all-targets
          cargo clippy -p graphql-orm -p graphql-orm-macros --locked --no-default-features --features sqlite,mssql,runtime-graphql --all-targets -- -D warnings

  # Fixture workspaces build into the shared target/fixtures directory used by
  # the fixture runner tests, never into the source tree.
  orm-backends:
    name: ORM PostgreSQL and SQL Server lanes
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Compile and lint every backend target
        run: |
          for backend in postgres mssql sqlite,mssql; do
            cargo check -p graphql-orm --locked --no-default-features --features "$backend" --all-targets
            cargo clippy -p graphql-orm -p graphql-orm-macros --locked --no-default-features --features "$backend" --all-targets -- -D warnings
          done
      - run: cargo test -p graphql-orm --no-default-features --features postgres --test federation_entity_keys_postgres --test zero_public_write_inputs_backends
      - name: Check composite subscription scope declarations on native backends
        run: |
          for backend in postgres mssql; do
            cargo test -p graphql-orm --locked --no-default-features --features "$backend,router-protocol" --test composite_subscription_scopes
          done
      - name: Verify owned PostgreSQL lifetime, non-bypass RLS, managed versions, keyed subscriptions, node ids and FK/key migration order
        env:
          CARGO_BUILD_JOBS: "1"
        run: |
          cargo test -p graphql-orm --locked --no-default-features --features postgres --test full_text_search --test owned_postgres_lifecycle --test postgres_rls --test postgres_rls_drift --test managed_version --test empty_filter_semantics --test keyed_changed_subscriptions --test node_ids --test point_read_visibility_backends --test migration_composite_uniques --test mutation_hook_public_errors --test visible_row_pages --test bulk_write_targets --test transaction_scope_backends --test ordered_sort -- --include-ignored --test-threads=1
          cargo test -p graphql-orm --locked --no-default-features --features postgres,change-journal --test postgres_rls_coverage --test postgres_change_journal_paths --test dependent_delete_repro --test backup_roundtrip -- --include-ignored --test-threads=1
          cargo test -p graphql-orm --locked --no-default-features --features postgres,change-journal --lib catalog_read_cancellation -- --include-ignored --test-threads=1
          cargo test -p graphql-orm --locked --no-default-features --features sqlite,change-journal --test dependent_delete_repro --test backup_roundtrip --test generated_error_sanitization
      - name: Execute the global node lookup through the router on owned PostgreSQL
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo test -p graphql-orm --locked --no-default-features --features sqlite --test federation_end_to_end_fixture -- --ignored node_lookup_through_the_router_on_owned_postgres
      - name: Execute runtime strings and binding identity on owned PostgreSQL
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo test -p graphql-orm --locked --no-default-features --features postgres --test runtime_strings -- --include-ignored --test-threads=1
      - name: Execute the private runtime string consumer on owned PostgreSQL
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo test --manifest-path crates/graphql-orm/tests/fixtures/repository-aggregate-consumer/Cargo.toml --target-dir target/fixtures --locked --no-default-features --features postgres --test runtime_strings -- --ignored --test-threads=1
      - name: Execute the private runtime string consumer on owned SQLite
        run: cargo run --manifest-path crates/graphql-orm/tests/fixtures/repository-aggregate-consumer/Cargo.toml --target-dir target/fixtures --locked --no-default-features --features sqlite --example runtime_strings
      - name: Execute owned runtime migration preservation and compatibility
        run: |
          cargo test -p graphql-orm --locked --no-default-features --features postgres --test runtime_mutations --test runtime_migrations --test runtime_schema_ir --test runtime_migration_memory --test migration_planner --test migration_apply --test legacy_migration_history -- --test-threads=1
          cargo test -p graphql-orm --locked --no-default-features --features mssql --test runtime_migrations_unsupported
          for backend in postgres mssql; do
            cargo test --manifest-path crates/graphql-orm/tests/fixtures/migration-api-compatibility/Cargo.toml --target-dir target/fixtures --locked --no-default-features --features "$backend"
          done
      - name: Execute host timestamps on owned PostgreSQL
        run: cargo test -p graphql-orm --locked --no-default-features --features postgres --test host_timestamps -- --ignored --test-threads=1
      - name: Execute the private PostgreSQL host timestamp consumer
        run: cargo test --manifest-path crates/graphql-orm/tests/fixtures/repository-aggregate-consumer/Cargo.toml --target-dir target/fixtures --locked --no-default-features --features postgres --test host_timestamps -- --ignored --test-threads=1
      - run: cargo check -p graphql-orm --no-default-features --features mssql
      - name: Execute MSSQL schema and query regressions without a database
        run: cargo test -p graphql-orm --locked --no-default-features --features mssql --test federation_entity_keys_mssql --test runtime_records --test query_ir --test composite_primary_keys --test zero_public_write_inputs_backends --test mssql_transport

  orm-security-sqlite:
    name: Current authority and subscription privacy (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Require current authority, strict policies, pagination, and private event delivery
        run: |
          bash scripts/run-security-test-targets.sh sqlite,auth-agql \
            current_authority authorization_mode authorized_pagination \
            subscription_release_authorization subscription_provenance_authorization \
            subscription_repository_provenance
      - name: Require exact receiver-purpose admission
        run: bash scripts/run-security-test-targets.sh sqlite,receiver-admission receiver_admission

  orm-security-portable:
    name: Portable authorization and scan bounds (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        backend: [sqlite, postgres, mssql]
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Execute portable security regressions on an owned backend
        run: bash scripts/run-security-test-targets.sh "${{ matrix.backend }}" subscription_portable_authorization bounded_protected_scans
      - name: Compile and lint current-authority policy on the selected backend
        run: cargo clippy -p graphql-orm --locked --no-default-features --features "${{ matrix.backend }},auth-agql" --lib -- -D warnings

  sqlserver-security:
    name: Owned SQL Server transport and transaction checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Execute the complete owned MSSQL lane
        env:
          GRAPHQL_ORM_TEST_MSSQL_PULL: missing
        run: scripts/run-owned-database-lanes.sh mssql
      - name: Verify TLS and retained query notifications on owned servers
        env:
          GRAPHQL_ORM_TEST_MSSQL_PULL: missing
        run: cargo test -p graphql-orm --locked --no-default-features --features mssql --test mssql_tls --test mssql_transport --test mssql_notifications -- --ignored --test-threads=1

  orm-text-group-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Execute complete SQLite groups and authorized aggregates
        run: cargo test -p graphql-orm --locked --no-default-features --features sqlite --lib --test complete_group_pages --test portable_group_pages --test grouped_aggregates
      - name: Execute the dependency-minimal private repository example
        run: cargo run --manifest-path crates/graphql-orm/tests/fixtures/repository-aggregate-consumer/Cargo.toml --target-dir target/fixtures --locked --no-default-features --features sqlite --example complete_events
      - name: Verify unsupported profiles before pool I/O
        run: |
          cargo test -p graphql-orm --locked --no-default-features --features postgres --lib
          cargo test -p graphql-orm --locked --no-default-features --features mssql --lib --test complete_group_pages_unsupported
      - name: Execute existing aggregates on a test-owned PostgreSQL container
        run: cargo test -p graphql-orm --locked --no-default-features --features postgres --test grouped_aggregates_postgres --test portable_group_pages -- --ignored --test-threads=1
      - name: Execute the private PostgreSQL consumer without query SQL
        run: cargo test --manifest-path crates/graphql-orm/tests/fixtures/repository-aggregate-consumer/Cargo.toml --target-dir target/fixtures --locked --no-default-features --features postgres --test portable_groups -- --ignored --test-threads=1
      - name: Check explicit backend Clippy and Rustdoc lanes
        run: |
          for backend in sqlite postgres mssql; do
            cargo clippy -p graphql-orm -p graphql-orm-macros --locked --no-default-features --features "$backend" --lib --test complete_group_pages --test portable_group_pages --test complete_group_pages_unsupported -- -D warnings
            RUSTDOCFLAGS="-D warnings" cargo doc -p graphql-orm -p graphql-orm-macros --locked --no-default-features --features "$backend" --no-deps
          done
          cargo clippy --manifest-path crates/graphql-orm/tests/fixtures/repository-aggregate-consumer/Cargo.toml --target-dir target/fixtures --locked --no-default-features --features sqlite --all-targets -- -D warnings

  orm-policy-projections:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test -p graphql-orm --locked --no-default-features --features sqlite --test projection_visibility --test read_projections
      - name: Execute projection authorization on a test-owned PostgreSQL container
        run: cargo test -p graphql-orm --locked --no-default-features --features postgres --test projection_visibility
      - run: cargo run --manifest-path crates/graphql-orm/tests/fixtures/repository-aggregate-consumer/Cargo.toml --target-dir target/fixtures --locked --no-default-features --features sqlite --example policy_projections
      - name: Check explicit backend lanes
        run: |
          for backend in sqlite postgres mssql; do
            cargo clippy -p graphql-orm -p graphql-orm-macros --locked --no-default-features --features "$backend" --lib --test projection_visibility -- -D warnings
          done

  # The suites that spell names through tests/support/graphql_case.rs, under
  # every snake-case feature together (#267).
  orm-case-features:
    name: ORM snake-case naming
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test -p graphql-orm --locked --no-default-features --features sqlite,resolver-case-snake,argument-case-snake,field-case-snake --test managed_version --test empty_filter_semantics --test keyed_changed_subscriptions --test node_ids --test grouped_aggregates --test record_version_ui --test subscription_path_order --test composite_subscription_scopes --test operation_catalog_sdl_conformance

  companions:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: scripts/check-ai-provider-lanes.sh test
      - run: cargo test -p graphql-orm-ai --features graphql-case-pascal --test graphql_naming
      - run: cargo clippy -p graphql-orm-ai --all-targets --features provider-openai,provider-anthropic,provider-xai,provider-ollama,provider-openai-compatible,provider-chat-completions,local-harness -- -D warnings
      - run: cargo clippy -p graphql-orm-operation-catalog -p graphql-orm-ai-tool-profiles --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc -p graphql-orm-ai -p graphql-orm-operation-catalog -p graphql-orm-ai-tool-profiles --features graphql-orm-ai/provider-openai,graphql-orm-ai/provider-anthropic,graphql-orm-ai/provider-xai,graphql-orm-ai/provider-ollama,graphql-orm-ai/provider-openai-compatible,graphql-orm-ai/provider-chat-completions,graphql-orm-ai/local-harness --no-deps

  ai-provider-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Ring build excludes aws-lc; each TLS stack compiles; guard refuses zero or two stacks
        run: scripts/check-ai-provider-tls.sh all

  router:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test -p graphql-orm-router-protocol --locked
      - run: cargo test -p graphql-orm-router --locked
      - run: cargo test -p graphql-orm-router --locked --features auth-agql
      - name: Validate a fresh standalone router consumer without an input lockfile
        run: bash scripts/check-router-fresh-consumer.sh
      - run: python3 scripts/test-router-semver-baseline.py
      - run: cargo clippy -p graphql-orm-router-protocol --all-targets --locked -- -D warnings
      - run: cargo clippy -p graphql-orm-router --all-targets --locked -- -D warnings
      - run: cargo clippy -p graphql-orm-router --all-targets --locked --features auth-agql -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc -p graphql-orm-router-protocol --no-deps --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p graphql-orm-router --no-deps --locked
      - run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc -p graphql-orm-router --no-deps --locked --features auth-agql

  router-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test -p graphql-orm-router-protocol --locked
      - run: cargo test -p graphql-orm-router --locked

  package-release-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: scripts/check-package-release-policy.sh "${BASE_SHA}"

  alternate-features:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Compile and lint every AI target on alternate backends
        run: |
          for backend in postgres mssql; do
            cargo check -p graphql-orm -p graphql-orm-macros -p graphql-orm-ai --locked --no-default-features --features "$backend,runtime-graphql" --all-targets
            cargo clippy -p graphql-orm-ai --locked --no-default-features --features "$backend" --all-targets -- -D warnings
          done
      - run: cargo check -p graphql-orm-ai --no-default-features --features mssql
      - run: cargo check -p graphql-orm-ai -p graphql-orm --no-default-features --features graphql-orm-ai/sqlite,graphql-orm/mssql
      - run: cargo check -p graphql-orm-backup --no-default-features --features local,orm-postgres
      - name: Backup round trip on a test-owned PostgreSQL container
        run: cargo test -p graphql-orm-backup --locked --no-default-features --features local,orm-postgres --test orm_016_postgres_conformance -- --ignored --test-threads=1
      - run: cargo check -p graphql-orm-storage --no-default-features --features s3,azure --all-targets
      - run: cargo check -p graphql-orm-storage --no-default-features --features smb --all-targets
      - name: Run owner-local SMB vendor unit tests (GHSA-439h-2cx8-xwgx regression)
        run: scripts/test-smb-vendor.sh
      - name: Verify the SMB vendor tree against the registry archive and recorded patches
        run: |
          archive="${RUNNER_TEMP}/smb-0.10.2.crate"
          curl --proto '=https' --tlsv1.2 -sSfL -o "${archive}" https://static.crates.io/crates/smb/smb-0.10.2.crate
          python3 scripts/verify-smb-backport.py --archive "${archive}"

  ai-postgres-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cf201f30d2291af293e25b32e435b13c42d51aaf # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run ORM parity against a test-owned disposable PostgreSQL container
        run: cargo test -p graphql-orm-ai --no-default-features --features postgres,provider-openai --test postgres_parity -- --test-threads=1

  semver:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Create baseline worktree
        run: git worktree add ../graphql-orm-baseline "${BASE_SHA}"
      - name: Constrain the historical Hive telemetry dependency without changing its source or features
        run: python3 scripts/prepare-router-semver-baseline.py ../graphql-orm-baseline
      - id: companion-baseline
        name: Detect consolidated packages in the baseline
        run: |
          if git cat-file -e "${BASE_SHA}:crates/graphql-orm-ai/Cargo.toml"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - id: router-baseline
        name: Detect router packages in the baseline
        run: |
          if git cat-file -e "${BASE_SHA}:crates/graphql-orm-router/Cargo.toml"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          manifest-path: crates/graphql-orm/Cargo.toml
          package: graphql-orm
          verbose: true
          rust-toolchain: 1.97.1
          baseline-root: ../graphql-orm-baseline/crates/graphql-orm
          feature-group: default-features
      # graphql-orm-macros is deliberately absent. It is a proc-macro crate, so
      # it exposes no library API surface for cargo-semver-checks to analyze;
      # newer versions of the tool now fail the job outright rather than
      # silently checking nothing. scripts/check-semver.sh has excluded it for
      # the same reason. Macro compatibility is covered by the aligned
      # package-version gate and the full compile/trybuild fixture matrix.
      - if: steps.companion-baseline.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          manifest-path: crates/graphql-orm-operation-catalog/Cargo.toml
          package: graphql-orm-operation-catalog
          verbose: true
          rust-toolchain: 1.97.1
          baseline-root: ../graphql-orm-baseline/crates/graphql-orm-operation-catalog
          feature-group: default-features
      - if: steps.companion-baseline.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          manifest-path: crates/graphql-orm-ai-tool-profiles/Cargo.toml
          package: graphql-orm-ai-tool-profiles
          verbose: true
          rust-toolchain: 1.97.1
          baseline-root: ../graphql-orm-baseline/crates/graphql-orm-ai-tool-profiles
          feature-group: default-features
      - if: steps.companion-baseline.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          manifest-path: crates/graphql-orm-storage/Cargo.toml
          package: graphql-orm-storage
          verbose: true
          rust-toolchain: 1.97.1
          baseline-root: ../graphql-orm-baseline/crates/graphql-orm-storage
          feature-group: default-features
      - if: steps.companion-baseline.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          manifest-path: crates/graphql-orm-backup/Cargo.toml
          package: graphql-orm-backup
          verbose: true
          rust-toolchain: 1.97.1
          baseline-root: ../graphql-orm-baseline/crates/graphql-orm-backup
          feature-group: default-features
      - if: steps.companion-baseline.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          manifest-path: crates/graphql-orm-ai/Cargo.toml
          package: graphql-orm-ai
          verbose: true
          rust-toolchain: 1.97.1
          baseline-root: ../graphql-orm-baseline/crates/graphql-orm-ai
          feature-group: default-features
      - if: steps.router-baseline.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          manifest-path: crates/graphql-orm-router-protocol/Cargo.toml
          package: graphql-orm-router-protocol
          verbose: true
          rust-toolchain: 1.97.1
          baseline-root: ../graphql-orm-baseline/crates/graphql-orm-router-protocol
          feature-group: default-features
      - if: steps.router-baseline.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          manifest-path: crates/graphql-orm-router/Cargo.toml
          package: graphql-orm-router
          verbose: true
          rust-toolchain: 1.97.1
          baseline-root: ../graphql-orm-baseline/crates/graphql-orm-router
          feature-group: default-features
