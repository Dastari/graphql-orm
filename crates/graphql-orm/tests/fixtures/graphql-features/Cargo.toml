[package]
name = "graphql-features-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["orm", "sqlite"]
orm = ["dep:graphql-orm"]
ai = ["dep:graphql-orm-ai"]
profiles = ["dep:graphql-orm-ai-tool-profiles"]
auth = ["dep:agql-auth", "graphql-orm?/auth-agql"]
sqlite = ["graphql-orm?/sqlite", "graphql-orm-ai?/sqlite"]
postgres = ["graphql-orm?/postgres", "graphql-orm-ai?/postgres"]
mssql = ["graphql-orm?/mssql", "graphql-orm-ai?/mssql"]
runtime = ["graphql-orm/runtime-graphql"]
router = ["graphql-orm/router-protocol"]
router-auth = ["dep:graphql-orm-router", "graphql-orm-router/auth-agql", "auth"]
provider = ["graphql-orm-ai/provider-openai-core", "graphql-orm-ai/provider-tls-ring"]
additive = ["async-graphql/graphiql", "async-graphql/tempfile"]
# Probes intentionally add no GraphQL capability. They fail without `additive`.
probe-ui = []
probe-tempfile = ["dep:tempfile"]

[dependencies]
async-graphql = { version = "7", default-features = false }
graphql-orm = { path = "../../..", default-features = false, optional = true }
graphql-orm-ai = { path = "../../../../graphql-orm-ai", default-features = false, optional = true }
graphql-orm-ai-tool-profiles = { path = "../../../../graphql-orm-ai-tool-profiles", optional = true }
agql-auth = { git = "https://github.com/Dastari/agql-auth.git", rev = "1f4b4bfb6d052d04e6c80b80cb7aa3d0c2ebaacd", version = "0.24.0", optional = true }
graphql-orm-router = { path = "../../../../graphql-orm-router", optional = true }
tempfile = { version = "3", optional = true }

[[example]]
name = "ui"
required-features = ["probe-ui"]

[[example]]
name = "upload-file"
required-features = ["probe-tempfile"]
