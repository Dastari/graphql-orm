[package]
name = "migration-api-compatibility"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[features]
default = ["sqlite"]
sqlite = ["graphql-orm/sqlite"]
postgres = ["graphql-orm/postgres"]
mssql = ["graphql-orm/mssql"]

[dependencies]
graphql-orm = { path = "../../..", default-features = false }
