[package]
name = "repository-aggregate-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[features]
default = ["sqlite"]
runtime-graphql = ["graphql-orm/runtime-graphql"]
sqlite = ["graphql-orm/sqlite"]
postgres = ["graphql-orm/postgres"]
mssql = ["graphql-orm/mssql"]

[dependencies]
graphql-orm = { path = "../../..", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
chacha20poly1305 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
