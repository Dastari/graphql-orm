[package]
name = "auth-service"
version = "0.1.0"
edition = "2024"

[dependencies]
agql-auth = { git = "https://github.com/Dastari/agql-auth.git", tag = "v0.24.0", version = "0.24.0" }
async-graphql = { version = "7", default-features = false, features = ["dataloader", "uuid", "decimal"] }
graphql-orm = { path = "../../../../", default-features = false, features = [
  "sqlite",
  "auth-agql",
  "resolver-case-pascal",
  "argument-case-pascal",
  "field-case-pascal",
] }
serde = { version = "1", features = ["derive"] }
