[package]
name = "federation-e2e"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["sqlite"]
sqlite = ["zones-subgraph/sqlite", "readings-subgraph/sqlite", "fixture-database/sqlite"]
postgres = ["zones-subgraph/postgres", "readings-subgraph/postgres", "fixture-database/postgres"]
mssql = ["zones-subgraph/mssql", "readings-subgraph/mssql", "fixture-database/mssql"]

[dependencies]

[dev-dependencies]
async-graphql = { version = "7", default-features = false, features = ["dataloader", "uuid", "decimal"] }
base64 = "0.22"
fixture-database = { path = "../fixture-database", default-features = false }
# The backend comes from the subgraph crates' feature selection.
graphql-orm = { path = "../../../../", default-features = false, features = ["router-protocol"] }
graphql-orm-router = { path = "../../../../../graphql-orm-router" }
graphql-orm-router-protocol = { path = "../../../../../graphql-orm-router-protocol" }
ntex = "=3.12.3"
readings-subgraph = { path = "../readings-subgraph", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subgraph-http = { path = "../subgraph-http" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
zones-subgraph = { path = "../zones-subgraph", default-features = false }
