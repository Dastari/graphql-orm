[package]
name = "zones-subgraph"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-graphql = { version = "7", features = ["dataloader", "uuid"] }
graphql-orm = { path = "../../../../", default-features = false, features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subgraph-http = { path = "../subgraph-http" }
tokio = { version = "1", features = ["rt"] }
