[package]
name = "cross-crate-target-models"
version = "0.0.0"
edition = "2024"
publish = false

[features]
unreadable-target-key = []
default = ["sqlite"]
sqlite = ["graphql-orm/sqlite", "cross-crate-ancestor-models/sqlite"]
postgres = ["graphql-orm/postgres", "cross-crate-ancestor-models/postgres"]
mssql = ["graphql-orm/mssql", "cross-crate-ancestor-models/mssql"]

dependent-child = ["cross-crate-ancestor-models/dependent-parent"]
dependent-parent-opt-in = ["dependent-child", "cross-crate-ancestor-models/dependent-parent-opt-in"]

[dependencies]
graphql-orm.workspace = true
async-graphql = { workspace = true, features = ["dataloader", "uuid", "decimal"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

cross-crate-ancestor-models = { path = "../ancestor-models", default-features = false }
