[package]
rust-version = "1.97.1"
name = "graphql-orm-macros"
version = "0.201.0"
edition = "2024"
authors = ["Toby Martin"]
description = "Procedural macros for async-graphql and ORM-backed entities, relations, and CRUD operations."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Dastari/graphql-orm"
homepage = "https://github.com/Dastari/graphql-orm/tree/main/crates/graphql-orm-macros"
documentation = "https://github.com/Dastari/graphql-orm/tree/main/crates/graphql-orm-macros"
publish = false
keywords = ["graphql", "proc-macro", "async-graphql", "sqlx", "orm"]
categories = ["development-tools::procedural-macro-helpers", "database", "web-programming"]

[package.metadata.distribution]
method = "git-full-revision"

[lib]
proc-macro = true

[features]
default = ["sqlite"]
# Dedicated export builds only: Cargo unifies this feature across consumers.
schema-export-only = []
sqlite = []
postgres = []
mssql = []

[dependencies]
convert_case = "0.7"
# The version and features async-graphql-derive resolves, so handwritten root
# field names are derived exactly as it derives them.
Inflector = { version = "0.11.4", default-features = false }
proc-macro2 = "1"
quote = "1"
rust_decimal = { workspace = true }
syn = { version = "2", features = ["full", "parsing", "extra-traits", "visit-mut"] }
