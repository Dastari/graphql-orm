[package]
rust-version = "1.97.1"
name = "graphql-orm-backup"
version = "0.33.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Dastari/graphql-orm"
description = "Backup and restore orchestration primitives for graphql-orm applications"
publish = false

[package.metadata.distribution]
method = "git-full-revision"

[lints]
workspace = true

[features]
default = ["local"]
local = ["dep:tokio", "graphql-orm-storage/local"]
smb = ["dep:secrecy", "graphql-orm-storage/smb"]
# Select orm-sqlite or orm-postgres in applications. Using orm directly
# uses graphql-orm's default backend, so it is only correct when that is
# SQLite or PostgreSQL and no other ORM backend is unified into the build.
orm = ["dep:graphql-orm"]
orm-sqlite = ["orm", "graphql-orm/sqlite"]
orm-postgres = ["orm", "graphql-orm/postgres"]
# Exact JSON float decoding preserves the binary identity across restore.
canonical-journal-keys = ["serde_json/float_roundtrip"]

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
graphql-orm = { workspace = true, optional = true }
graphql-orm-storage = { workspace = true }
hkdf = "0.12"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = { version = "0.10", optional = true }
sha2 = "0.10"
thiserror = "2"
# Asynchronous file-system checks for the local repository only.
tokio = { version = "1", features = ["fs"], optional = true }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }

[[test]]
name = "backup_local"
path = "tests/backup_local/main.rs"
required-features = ["local"]

[[test]]
name = "backup_sqlite"
path = "tests/backup_sqlite/main.rs"
required-features = ["local", "orm-sqlite"]

[[test]]
name = "backup_postgres"
path = "tests/backup_postgres/main.rs"
required-features = ["local", "orm-postgres"]

[[test]]
name = "backup_smb"
path = "tests/backup_smb/main.rs"
required-features = ["smb"]
