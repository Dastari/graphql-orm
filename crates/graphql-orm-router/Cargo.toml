[package]
rust-version = "1.97.1"
name = "graphql-orm-router"
version = "0.21.0"
edition = "2024"
description = "Federated GraphQL router for graphql-orm and project-neutral subgraphs"
license = "MIT"
repository = "https://github.com/Dastari/graphql-orm"
publish = false

[package.metadata.distribution]
method = "git-full-revision"

[features]
default = []
auth-agql = ["dep:agql-auth"]

[dependencies]
agql-auth = { workspace = true, optional = true }
arc-swap = { workspace = true }
base64 = { workspace = true }
cynic-parser = { workspace = true }
# Hive 0.2.19 exchanges SDK 0.32 types with Datadog. 0.5.3 selects SDK 0.33.
# Keep fresh consumers coherent without enabling Datadog's default features.
datadog-opentelemetry = { version = "=0.5.2", default-features = false }
futures = { workspace = true }
getrandom = { workspace = true }
graphql-composition = { workspace = true }
graphql-orm-router-protocol = { workspace = true }
hive-router = { workspace = true }
jsonwebtoken = { workspace = true }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["metrics"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = "2.6"
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["process"] }
signal-hook = { workspace = true }

# The fuzz harness module is compiled only with this crate-specific cfg, so a
# downstream `cargo fuzz` build (which sets `--cfg fuzzing` for every crate)
# never exposes it; see `fuzz/README.md`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(graphql_orm_router_fuzzing)"] }

# Package lints also reach the outbound proxy test, which sets process
# environment variables with unsafe Rust. The library forbids unsafe code.
[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dev-dependencies]
ntex = "=3.12.3"
proptest = { workspace = true }
sha1 = { workspace = true }
time = "0.3"
