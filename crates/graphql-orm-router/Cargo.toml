[package]
name = "graphql-orm-router"
version = "0.8.0"
edition = "2024"
rust-version = "1.90"
description = "Federated GraphQL router for graphql-orm and project-neutral subgraphs"
license = "MIT"
repository = "https://github.com/Dastari/graphql-orm"
publish = false

[package.metadata.distribution]
method = "git-full-revision"

[features]
default = []
auth-agql = ["dep:agql-auth"]

[dependencies]
agql-auth = { workspace = true, optional = true }
arc-swap = { workspace = true }
base64 = { workspace = true }
cynic-parser = { workspace = true }
# Hive 0.2.19 exchanges SDK 0.32 types with Datadog. 0.5.3 selects SDK 0.33.
# Keep fresh consumers coherent without enabling Datadog's default features.
datadog-opentelemetry = { version = "=0.5.2", default-features = false }
futures = { workspace = true }
getrandom = { workspace = true }
graphql-composition = { workspace = true }
graphql-orm-router-protocol = { workspace = true }
hive-router = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }

[dev-dependencies]
ntex = "=3.12.3"
sha1 = { workspace = true }
time = "0.3"
