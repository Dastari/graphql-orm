[package]
name = "graphql-orm-router"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Federated GraphQL router for graphql-orm and project-neutral subgraphs"
license = "MIT"
repository = "https://github.com/Dastari/graphql-orm"
publish = false

[package.metadata.distribution]
method = "git-full-revision"

[features]
default = []
auth-agql = ["dep:agql-auth"]

[dependencies]
agql-auth = { workspace = true, optional = true }
arc-swap = { workspace = true }
cynic-parser = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
graphql-composition = { workspace = true }
graphql-orm-router-protocol = { workspace = true }
hive-router = { workspace = true }
hive-router-config = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
ntex = "=3.10.0"
sha1 = { workspace = true }
