[package]
name = "graphql-orm-ai"
version = "0.120.0"
edition = "2024"
authors = ["Toby Martin <toby@dastari.net>"]
description = "Project-agnostic AI agent runtime for graphql-orm applications"
license = "MIT"
repository = "https://github.com/Dastari/graphql-orm"
homepage = "https://github.com/Dastari/graphql-orm"
readme = "README.md"
keywords = ["ai", "graphql", "agents", "orm", "async-graphql"]
categories = ["web-programming", "api-bindings"]
publish = false

[features]
default = ["sqlite"]
sqlite = [
  "graphql-orm/sqlite",
]
postgres = [
  "graphql-orm/postgres",
]
mssql = ["graphql-orm/mssql"]
# Provider adapters. Each `provider-*` feature is its `-core` adapter plus the
# historical TLS stack (rustls with aws-lc-rs). Select `-core` features with
# exactly one `provider-tls-*` feature to choose the stack instead.
provider-openai = ["provider-openai-core", "provider-tls-aws-lc"]
provider-anthropic = ["provider-anthropic-core", "provider-tls-aws-lc"]
provider-xai = ["provider-xai-core", "provider-tls-aws-lc"]
provider-ollama = ["provider-ollama-core", "provider-tls-aws-lc"]
provider-openai-compatible = ["provider-openai-compatible-core", "provider-tls-aws-lc"]
provider-chat-completions = ["provider-chat-completions-core", "provider-tls-aws-lc"]
provider-openai-core = ["dep:base64", "dep:hmac", "dep:reqwest"]
provider-anthropic-core = ["dep:reqwest"]
provider-xai-core = ["dep:base64", "dep:reqwest"]
provider-ollama-core = ["dep:base64", "dep:reqwest"]
provider-openai-compatible-core = ["dep:base64", "dep:reqwest"]
provider-chat-completions-core = ["dep:reqwest"]
# Provider HTTP TLS stacks; exactly one is required by any adapter.
provider-tls-aws-lc = ["reqwest?/rustls"]
provider-tls-ring = [
  "reqwest?/rustls-no-provider",
  "dep:rustls",
  "dep:rustls-platform-verifier",
]
provider-tls-native = ["reqwest?/native-tls"]
local-harness = []
provider-codex-app-server = ["dep:base64"]
provider-grok-acp = []
graphql-case-pascal = [
  "graphql-orm/resolver-case-pascal",
  "graphql-orm/argument-case-pascal",
  "graphql-orm/field-case-pascal",
]

[dependencies]
agql-auth = { workspace = true }
async-graphql = { workspace = true, features = ["uuid"] }
async-graphql-parser = { workspace = true }
async-stream = "0.3"
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
futures = "0.3"
graphql-orm = { workspace = true }
graphql-orm-ai-tool-profiles = { workspace = true }
graphql-orm-storage = { workspace = true }
hex = "0.4"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
hmac = { version = "0.12", optional = true }
jsonschema = { version = "0.47", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "stream"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
rust_decimal = { workspace = true }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
graphql-orm = { workspace = true, features = ["runtime-graphql"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
