[workspace]
members = [
  "crates/graphql-orm-ai",
  "crates/graphql-orm-backup",
  "crates/graphql-orm",
  "crates/graphql-orm-macros",
  "crates/graphql-orm-storage",
]
default-members = [
  "crates/graphql-orm",
  "crates/graphql-orm-macros",
]
exclude = [
  "crates/graphql-orm-macros/fixtures/full-stack",
  "crates/graphql-orm-macros/fixtures/postgres-smoke",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Dastari/graphql-orm"

[workspace.dependencies]
agql-auth = { git = "https://github.com/Dastari/agql-auth.git", rev = "3f3b0c5365adfbe436514a681d977b600991b797", version = "0.12.0" }
async-graphql = { version = "7", features = ["dataloader", "uuid"] }
convert_case = "0.7"
futures = "0.3"
graphql-orm = { path = "crates/graphql-orm", version = "0.16.0", default-features = false }
graphql-orm-backup = { path = "crates/graphql-orm-backup", version = "0.6.0", default-features = false }
graphql-orm-storage = { path = "crates/graphql-orm-storage", version = "0.6.0", default-features = false }
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false }
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "rustls", "tokio", "tokio-util", "chrono"] }
tokio = { version = "1" }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1", features = ["v4"] }
